name: Build and Push PR Image

# Fires on every PR comment, including on issues — the job-level `if`
# below narrows this to an exact `/build` comment on a pull request.
on:
  issue_comment:
    types: [created]

# One in-flight build per PR: a second /build cancels the previous one
# instead of racing it for the same `pr-<PR_NUMBER>` tag.
concurrency:
  group: pr-build-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Validate /build request
    # Only an exact "/build" comment on a PR (not a plain issue), from a
    # commenter GitHub itself classifies as OWNER/MEMBER/COLLABORATOR.
    # This authorizes *who* may ask for a build; it says nothing about
    # *what* gets built, since the PR head can still be a fork — that is
    # checked separately below, before anything privileged runs.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/build' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: [self-hosted, falcon]
    permissions:
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
    steps:
      # The falcon runner image is not guaranteed to ship `gh`/`jq` (Aegis
      # avoids both there): fetch with curl, parse with setup-python's
      # interpreter instead of grepping nested JSON.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve PR head commit and fork status
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}")
          head_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"$pr_json")
          head_repo=$(python3 -c 'import json,sys; print((json.load(sys.stdin)["head"].get("repo") or {}).get("full_name", ""))' <<<"$pr_json")
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [ "$head_repo" = "$REPO" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push redfish-exporter
    needs: gate
    # A PR whose head lives in a fork is untrusted content: it must never
    # reach the build/push steps below, which run with `packages: write`.
    # Requiring `success()` explicitly here matters because this job
    # defines its own `if` — that replaces, not adds to, the implicit
    # "skip if `gate` was skipped/failed" check GitHub only applies when
    # no custom `if` is given.
    if: success() && needs.gate.outputs.is_fork == 'false'
    # Pinned to the docker-capable `falcon` runner, as Aegis does. Bare
    # `self-hosted` lands on the juniper runner, which has no docker
    # (`docker: command not found`, exit 127). The `falcon` label here is
    # served by this repo's own in-cluster scale set (summerwind
    # RunnerDeployment `redfish-exporter-runner`); Aegis's falcon-runner is
    # scoped to the Aegis repo and never takes this repo's jobs.
    runs-on: [self-hosted, falcon]
    permissions:
      contents: read
      packages: write
    # Same build mechanism as Aegis's main.yml: classic builder
    # (DOCKER_BUILDKIT=0) via the plain docker CLI, an isolated per-run
    # credential store, login via --password-stdin, always log out.
    env:
      DOCKER_BUILDKIT: '0'
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/redfish-exporter:pr-${{ github.event.issue.number }}
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          python3 -m pip install --quiet setuptools
          VERSION=$(python3 setup.py --version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Isolate Docker credential store
        shell: bash
        run: echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "${IMAGE_REF}" \
            --build-arg appVersion="${{ steps.version.outputs.version }}" \
            --build-arg maintainer=Freezing \
            .

      # Login only happens after a successful build, and only the next
      # step can push — a build failure above stops the job here.
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Push image
        shell: bash
        run: docker push "${IMAGE_REF}"

      - name: Log out of registries
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}" || true
