name: Build and Push Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Serialize publishing across runs so `latest`/version tags never race.
concurrency:
  group: build-and-push-main
  cancel-in-progress: false

env:
  IMAGE_NAME: 'redfish-exporter'

jobs:
  build:
    name: Build and push redfish-exporter
    # Must be the Docker-in-Docker-provisioned runner, not bare
    # `self-hosted` — this job runs `docker buildx`/`docker build`, which
    # needs a reachable Docker daemon (/var/run/docker.sock). Not every
    # `self-hosted` runner in the pool has one; `ubuntu-dind` does.
    runs-on: ubuntu-dind
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package version
        # The one source of truth for the published version tag is
        # `setup.py` itself — never a second, independently maintained
        # literal that has to be bumped by hand in lockstep.
        id: version
        run: |
          VERSION=$(python3 setup.py --version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          # GITHUB_TOKEN is always present (no external secret to configure)
          # and the `packages: write` permission above is already sufficient
          # for it to publish here — the deleted CI.yml build_images job
          # already proved this token works for this exact ghcr.io path.
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            appVersion=${{ steps.version.outputs.version }}
            maintainer=Freezing

  check_job_results:
    name: Check job results
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        uses: svtechnmaa/.github/actions/check_job_results@main
        with:
          jobs: ${{ toJSON(needs) }}
