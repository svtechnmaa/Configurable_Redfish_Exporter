name: Build and Test SVTECH App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      commit_id:
        description: 'Full commit ID to build (default: latest commit). e.g daae94a0f72a13f7092812fa42d684b2af827xxx. WARNING: release job will NOT run by this trigger'
        type: string
      run_test:
        description: 'Run test'
        default: true
        type: boolean
      keep_image: 
        description: 'Keep image in GHCR even test fails'
        type: boolean
        default: false    
env:
  # Modify your image and container here
  IMAGE_TEST_TAG: ${{ format('test-v{0}', github.run_number) }}
  IMAGE_TAG: '2.0.5' 
  IMAGE_NAME: 'redfish-exporter'
  CONTAINER_NAME: 'redfish-exporter'
  CONTAINER_MAPPING_PORT: '9814:9814'
  COMMIT_FULL_ID: ${{ inputs.commit_id || github.sha }}

jobs:  
  build:
    runs-on: ubuntu-dind
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      check_no_ci: ${{ steps.check_commit_message.outputs.no_ci }}
      check_no_scan: ${{ steps.check_commit_message.outputs.no_scan }}
      check_no_cache: ${{ steps.check_commit_message.outputs.no_cache }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.COMMIT_FULL_ID }}

    - name: Downcase REPO and shorten COMMIT ID
      run: |
        COMMIT_SHORT_ID=$(git rev-parse --short ${{ env.COMMIT_FULL_ID }})
        echo "COMMIT_SHORT_ID=${COMMIT_SHORT_ID}" >>${GITHUB_ENV}
        echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
        echo "COMMIT_SHORT_ID=${{ env.COMMIT_SHORT_ID }}"
        echo "REPO=${{ env.REPO }}"

    ## Check commit message for no-ci, no-scan, no-cache
    - name: Check commit message
      id: check_commit_message
      run: |
        commit_message=$(git log --pretty=format:"%H %s %b" | grep "${{ env.COMMIT_FULL_ID }}" | sed 's,'${{ env.COMMIT_FULL_ID }}' ,,g')

        if [[ "$commit_message" =~ .*"no-ci".* ]]; then
            echo "❌ Found 'no-ci' in commit message. Stopping workflow!"
            echo "no_ci=true" >> $GITHUB_OUTPUT

        elif [[ "$commit_message" =~ .*"no-scan".* ]]; then
            echo "🛑 Found 'no_scan' in commit message. Skipping image and Dockerfile scan!"
            echo "no_scan=true" >> $GITHUB_OUTPUT
            
        elif [[ "$commit_message" =~ .*"no-cache".* ]]; then
            echo "⚡ Found 'no_cache' in commit message. Skipping caching during image build!"
            echo "no_cache=true" >> $GITHUB_OUTPUT
        fi      
    - name: Get Job ID
      if: steps.check_commit_message.outputs.no_ci != 'true'
      id: get_job_id
      run: |
        curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
        "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
        | jq '.jobs[] | select(.name=="build") | .id' > job_id.txt
        echo "job_id=$(cat job_id.txt)" >> $GITHUB_OUTPUT

    - name: Determine Commit ID and Comitter Email
      if: steps.check_commit_message.outputs.no_ci != 'true'
      id: determine_commit_id_and_email_author
      run: |
        if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
          COMMIT_ID=${{ github.event.inputs.commit_id }}
          COMMIT_AUTHOR_EMAIL=$(git show -s --format='%ae' $COMMIT_ID)
          COMMIT_AUTHOR_NAME=$(git show -s --format='%aN' $COMMIT_ID)
        else
          COMMIT_ID=${{ github.event.head_commit.id }}
          COMMIT_AUTHOR_EMAIL=${{ github.event.head_commit.author.email }}
          COMMIT_AUTHOR_NAME=${{ github.event.head_commit.author.name }}
        fi

        echo "COMMIT_ID=${COMMIT_ID}" >> $GITHUB_OUTPUT
        echo "COMMIT_AUTHOR_EMAIL=${COMMIT_AUTHOR_EMAIL}" >> $GITHUB_OUTPUT
        echo "COMMIT_AUTHOR_NAME=${COMMIT_AUTHOR_NAME}" >> $GITHUB_OUTPUT

    - name: Login to Docker Container Registry (no cache)
      if: |
        (github.event_name == 'push' || github.event_name == 'pull_request' || steps.check_existing_image.outputs.is_image_tag_by_commit_id_existed == 'false') && 
        (steps.check_commit_message.outputs.no_cache == 'true' && steps.check_commit_message.outputs.no_ci != 'true')
      uses: docker/login-action@v2
      with:
        registry: docker.io
        username: '${{ secrets.DOCKER_HUB_USERNAME }}'
        password: '${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}'
    - name: Build Docker image (no cache)
      if: |
        (github.event_name == 'push' || github.event_name == 'pull_request' || steps.check_existing_image.outputs.is_image_tag_by_commit_id_existed == 'false') &&
        (steps.check_commit_message.outputs.no_cache == 'true' && steps.check_commit_message.outputs.no_ci != 'true')
      run: |
        docker build --no-cache -t ${{ env.IMAGE_NAME }} .
    - name: Login to GitHub Container Registry
      if: |
        (github.event_name == 'push' || github.event_name == 'pull_request' || 
        steps.check_existing_image.outputs.is_image_tag_by_commit_id_existed == 'false') && 
        steps.check_commit_message.outputs.no_ci != 'true'
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: '${{ github.repository_owner }}'
        password: '${{ secrets.GH_TOKEN }}'
    - name: Build Docker image (with cache)
      if: |
        (github.event_name == 'push' || github.event_name == 'pull_request') &&
        (steps.check_commit_message.outputs.no_cache != 'true' && steps.check_commit_message.outputs.no_ci != 'true')
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/redfish-exporter:latest || true
        docker build --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from ghcr.io/${{ github.repository_owner }}/redfish-exporter:latest -t ${{ env.IMAGE_NAME }} .

    - name: Scan Dockerfile using Trivy and send mail if vulnerabilities detected
      if: steps.check_commit_message.outputs.no_ci != 'true' && steps.check_commit_message.outputs.no_scan != 'true'
      uses: svtechnmaa/.github/actions/run_trivy_scan_dockerfile@main
      with:
        dockerfile_path: './Dockerfile'
        commit_id: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_ID }}
        mail_username: ${{ vars.MAIL_USERNAME }}
        mail_password: ${{ secrets.MAIL_PASSWORD }}
        commit_author_email: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_AUTHOR_EMAIL }}
        commit_author_name: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_AUTHOR_NAME }}
        job_id: ${{ steps.get_job_id.outputs.job_id }}

    - name: Scan Docker image using Trivy and send mail if vulnerabilities detected
      if: steps.check_commit_message.outputs.no_ci != 'true' && steps.check_commit_message.outputs.no_scan != 'true'
      uses: svtechnmaa/.github/actions/run_trivy_scan_image@main
      with:
        trivy_server: ${{ secrets.TRIVY_SERVER }}
        image_name: ${{env.IMAGE_NAME}}
        image_tag: 'latest'
        commit_id: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_ID }}
        mail_username: ${{ vars.MAIL_USERNAME }}
        mail_password: ${{ secrets.MAIL_PASSWORD }}
        commit_author_email: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_AUTHOR_EMAIL }}
        commit_author_name: ${{ steps.determine_commit_id_and_email_author.outputs.COMMIT_AUTHOR_NAME }}
        job_id: ${{ steps.get_job_id.outputs.job_id }}

    - name: Run App
      id: run_and_check_container_status
      if: steps.check_commit_message.outputs.no_ci != 'true'
      uses: svtechnmaa/.github/actions/run_docker_container@main
      with:
        imageName: '${{ env.IMAGE_NAME }}'
        containerName: '${{ env.CONTAINER_NAME }}'
        containerMappingPort: '${{ env.CONTAINER_MAPPING_PORT }}'

    - name: Push image to GitHub Container Registry
      if: steps.check_commit_message.outputs.no_ci != 'true'
      run: |
        docker tag ${{ env.IMAGE_NAME }}:latest ghcr.io/${{ env.REPO }}:${{ env.IMAGE_TEST_TAG }}
        docker tag ${{ env.IMAGE_NAME }}:latest ghcr.io/${{ env.REPO }}:${{ env.COMMIT_SHORT_ID }}
        docker push ghcr.io/${{ env.REPO }}:${{ env.IMAGE_TEST_TAG }}
        docker push ghcr.io/${{ env.REPO }}:${{ env.COMMIT_SHORT_ID }}

        # Migrate from old workflow
        docker tag ${{ env.IMAGE_NAME }}:latest ghcr.io/${{ github.repository_owner }}/redfish-exporter:2.x.x 
        docker tag ${{ env.IMAGE_NAME }}:latest ghcr.io/${{ github.repository_owner }}/redfish-exporter:latest
        docker push ghcr.io/${{ github.repository_owner }}/redfish-exporter:2.x.x 
        docker push ghcr.io/${{ github.repository_owner }}/redfish-exporter:latest
        

