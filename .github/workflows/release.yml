name: Promote PR Image to Release

# Release path WITHOUT a rebuild: when a PR is merged into `main`, the image
# that `/build` already produced for that PR (main.yml ->
# `redfish-exporter:pr-<PR_NUMBER>`) is re-tagged as
# `redfish-exporter:<VERSION_BASE>.<N>` and `latest`, where N is one past the
# highest `<VERSION_BASE>.N` tag already on GHCR.
#
# The promoted image must be exactly what was reviewed: main.yml stamps each
# PR image with `org.opencontainers.image.revision=<PR head SHA>`, and this
# workflow refuses to promote unless that label equals the merged PR's final
# head SHA. A missing image, a missing label, or a stale image (commits pushed
# after the last `/build`) fails the run — comment `/build` on the merged PR
# again, then re-run this workflow. Nothing here ever falls back to building.
#
# Trusted ref: the privileged `promote` job runs in the `release`
# environment, whose deployment-branch rule (repo Settings -> Environments ->
# release -> Deployment branches: Selected, `main` only) is enforced by
# GitHub, not by this file. That environment MUST exist with that rule before
# this workflow lands: referencing a missing environment auto-creates an
# unrestricted one.
on:
  push:
    branches: [main]

# Serialize version allocation across runs: two concurrent runs would read
# the same max patch from GHCR and push the same numbered tag.
#
# `queue: max` keeps every waiting run (up to GitHub's 100-per-group limit),
# in arrival order, so each merge is promoted to `latest` in merge order
# instead of a newer arrival cancelling the one waiting ahead of it.
# Requires cancel-in-progress to stay false.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io/svtechnmaa
  IMAGE: redfish-exporter
  # Bump to start a new minor line (e.g. '2.4' -> first tag 2.4.0).
  VERSION_BASE: '2.3'

jobs:
  # Test gate for the merged commit on `main`. No image is built here; this
  # only stops a merge that breaks the suite from being promoted. It sits
  # inside the workflow-level concurrency queue on purpose, so releases still
  # promote in merge order.
  test:
    name: Test gate (setup, syntax, full pytest suite)
    if: >
      github.repository == 'svtechnmaa/Configurable_Redfish_Exporter' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, falcon]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local test gate
        run: |
          scripts/test-env.sh setup
          scripts/test-env.sh verify

  promote:
    name: Re-tag PR image as release
    # No custom `if`: the implicit success() means a failed or skipped
    # `test` job stops the promotion.
    needs: test
    # GitHub refuses to start this job unless the run's ref passes the
    # `release` environment's deployment-branch rule (protected `main` only).
    environment: release
    # Docker-capable in-cluster scale set; see CI.yml / main.yml.
    runs-on: [self-hosted, falcon]
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      # Only for the version helper (.github/scripts/ghcr.sh); the
      # environment gate guarantees this commit is on `main`.
      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find merged PR for this commit
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls")
          # Exactly one PR merged into main whose merge commit is this push.
          SHA="$SHA" python3 -c '
          import json, os, sys
          sha = os.environ["SHA"]
          prs = [p for p in json.load(sys.stdin)
                 if p.get("merged_at") and p["base"]["ref"] == "main"
                 and p.get("merge_commit_sha") == sha]
          if len(prs) != 1:
              sys.exit(f"Expected exactly one PR merged into main as {sha}, found {len(prs)}; "
                       "direct pushes to main are not promoted.")
          number, head = prs[0]["number"], prs[0]["head"]["sha"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"number={number}\nhead_sha={head}\n")
          print(f"PR #{number}, head {head}")
          ' <<<"$pulls"

      - name: Isolate Docker credential store
        shell: bash
        run: echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Pull and verify PR image
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY}/${IMAGE}:pr-${PR_NUMBER}"
          docker pull "$SRC" || {
            echo "::error::${SRC} not found. Comment /build on PR #${PR_NUMBER}, then re-run this workflow."
            exit 1
          }
          built=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$SRC")
          if [ "$built" != "$HEAD_SHA" ]; then
            echo "::error::${SRC} was built from '${built:-<no revision label>}', but PR #${PR_NUMBER} merged head ${HEAD_SHA}. Comment /build on PR #${PR_NUMBER} again, then re-run this workflow."
            exit 1
          fi
          echo "Verified ${SRC} was built from ${HEAD_SHA}"

      # Version is allocated only after the source image is verified, so a
      # failed promotion never burns a patch number.
      - name: Compute next version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/ghcr.sh
          version="$(next_version "$IMAGE")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Computed ${IMAGE} version=${version}"

      - name: Tag and push release + latest
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY}/${IMAGE}:pr-${PR_NUMBER}"
          IMG="${REGISTRY}/${IMAGE}:${VERSION}"
          LATEST="${REGISTRY}/${IMAGE}:latest"
          docker tag "$SRC" "$IMG"
          docker tag "$SRC" "$LATEST"
          docker push "$IMG"
          docker push "$LATEST"
          echo "- \`${SRC}\` -> \`${IMG}\`, \`${LATEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of registries
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}" || true
