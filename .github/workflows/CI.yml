name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # All jobs run on the in-cluster `falcon` runner scale set (summerwind
  # RunnerDeployment `redfish-exporter-runner`), like Aegis: GitHub-hosted
  # runners are not available to this account, so an `ubuntu-latest` job
  # never starts.
  #
  # Security: a `pull_request` event checks out PR-controlled content and
  # executes it — this very `scripts/test-env.sh` is part of that checkout,
  # so a fork PR could rewrite it to run arbitrary commands inside the
  # cluster runner pod (cluster network access). With no disposable
  # GitHub-hosted runner to send it to, fork PRs are skipped entirely; only
  # PRs whose head branch lives in this repository run here.
  test_pr:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, falcon]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run local test gate (setup, syntax, full pytest suite)
      run: |
        scripts/test-env.sh setup
        scripts/test-env.sh verify

  # Trusted path: a genuine `push` to `main`. Bare `self-hosted` used to
  # land on the juniper host runner; pinning `falcon` keeps CI on the
  # cluster scale set with the image build.
  test:
    if: github.event_name == 'push'
    runs-on: [self-hosted, falcon]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run local test gate (setup, syntax, full pytest suite)
      run: |
        scripts/test-env.sh setup
        scripts/test-env.sh verify

  # Image build/publish now lives solely in main.yml (build job), so a
  # push to main is never built and tagged twice.
