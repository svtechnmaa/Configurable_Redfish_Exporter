name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Security fix: a `pull_request` event (including from a fork) checks
  # out PR-controlled content and then executes it — this very
  # `scripts/test-env.sh` is part of that checkout, so a malicious fork PR
  # could rewrite it to run arbitrary commands. That must never execute on
  # the persistent, non-ephemeral `self-hosted` runner below, which keeps
  # state/network access between jobs: untrusted code running there is a
  # host compromise, not just a failed CI run. This job runs the identical
  # test gate but only for `pull_request`, on a fresh, disposable
  # GitHub-hosted runner with no secrets and no privileged host access,
  # destroyed after the job finishes.
  test_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run local test gate (setup, syntax, full pytest suite)
      run: |
        scripts/test-env.sh setup
        scripts/test-env.sh verify

  # Trusted path only: a genuine `push` to `main` (never `pull_request`,
  # including a same-repo one) reaches the persistent `self-hosted`
  # runner. Repository token permissions are not relied on to protect the
  # runner host — the event-type gate below is what does that.
  test:
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run local test gate (setup, syntax, full pytest suite)
      run: |
        scripts/test-env.sh setup
        scripts/test-env.sh verify

  # Image build/publish now lives solely in main.yml (build job), so a
  # push to main is never built and tagged twice.
