---
kind: Namespace
apiVersion: v1
metadata:
  name: exporter
  labels:
    name: exporter

---
# The image-pull Secret referenced below ("github-token") is created
# externally (e.g. `kubectl create secret docker-registry ...`) — this
# manifest never inlines registry credentials (Migration & Rollback /
# "Kubernetes / Multi-Replica Operating Model" in plan.md).
#
# The deployment profile ("sample.yml", containing Auth + Tuning + Metrics
# together, FR-005) is likewise created externally as one complete Secret
# key, read-only, mode 0440 (group-readable by the container's fsGroup,
# since the container now runs as non-root — see securityContext below) —
# never a ConfigMap, never split across two objects:
#   kubectl create secret generic redfish-exporter-profile \
#     --from-file=sample.yml=./sample.yml -n exporter

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: exporter
  name: redfish-exporter-ingress
spec:
  podSelector:
    matchLabels:
      app: redfish-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Restrict to the operator's actual Prometheus namespace/pod
        # selectors — these example labels MUST be replaced with the
        # deployment's real Prometheus identity before applying.
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9814
  egress:
    # Any literal IPv4/IPv6 BMC target is permitted (no CIDR allow-list —
    # the exporter's own containment layer, not network policy, enforces
    # same-target discipline per request) but only on TCP/443: this exporter
    # never needs any other egress port or protocol.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443

---
kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: exporter
  name: redfish-exporter
  labels:
    name: redfish-exporter
    app: redfish-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redfish-exporter
  template:
    metadata:
      labels:
        app: redfish-exporter
    spec:
      # fsGroup must match the image's fixed non-root GID (Dockerfile
      # `addgroup -g 10001`) so the container can read the group-readable
      # (0440) Secret-mounted profile below without running as root.
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: github-token
      containers:
      - image: ghcr.io/svtechnmaa/redfish-exporter:latest
        name: physical-exporter
        imagePullPolicy: Always
        # Exactly one Uvicorn worker, passed explicitly (not relying on the
        # image's CLI default) so a future accidental change to that default
        # cannot silently alter production concurrency without a manifest
        # diff also being required.
        args: ["--workers", "1"]
        ports:
        - containerPort: 9814
          protocol: TCP
          name: red-ex-port
        # Hardened container security context (Trivy KSV-0014/KSV-0118).
        # UID/GID 10001 is the image's actual fixed non-root user (Dockerfile
        # `USER 10001:10001`), not an arbitrary value. The app only ever
        # writes under /tmp (app/access logs, opt-in debug artifacts), which
        # is provided by the separate `tmp` emptyDir below, so the root
        # filesystem itself can stay fully read-only.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 9814
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9814
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: redfish-profile
          mountPath: "/opt/redfish_exporter/templates/configs"
          readOnly: true
        # Writable scratch space for app/access logs and opt-in debug
        # artifacts (all under /tmp) now that the root filesystem is
        # read-only.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: redfish-profile
        secret:
          secretName: redfish-exporter-profile
          defaultMode: 0440
          items:
          - key: "sample.yml"
            path: "sample.yml"
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  namespace: exporter
  name: redfish-exporter
  labels:
    name: redfish-exporter
spec:
  selector:
    app: redfish-exporter
  ports:
    - name: red-ex-port
      protocol: TCP
      port: 9814
      targetPort: 9814
  type: ClusterIP
